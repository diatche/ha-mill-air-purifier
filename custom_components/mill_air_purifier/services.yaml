set_room_temperature:
  fields:
    room_name:
      required: true
      example: "kitchen"
      selector:
        text:
    away_temp:
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    comfort_temp:
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    sleep_temp:
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
